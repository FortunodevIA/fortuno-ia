<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Fortuno IA</title>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 0 auto; padding: 16px; }
    nav { display: flex; gap: 16px; align-items: center; padding-bottom: 12px;
          border-bottom: 1px solid #ccc; margin-bottom: 20px; }
    nav form { margin: 0; }
  </style>
</head>
<body>
  <nav>
    <strong>Fortuno IA</strong>
    <a href="{% url 'accueil' %}">Accueil</a>
    {% if user.is_authenticated %}
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}<button>Se déconnecter ({{ user.username }})</button>
      </form>
    {% else %}
      <a href="{% url 'login' %}">Connexion</a>
      <a href="{% url 'inscription' %}">Créer un compte</a>
    {% endif %}
    {% if user.is_authenticated %}
      <a href="{% url 'analyser' %}">Analyser</a>
      <a href="{% url 'historique' %}">Historique</a>
    {% endif %}
  </nav>
  {% block contenu %}{% endblock %}
</body>
</html>
